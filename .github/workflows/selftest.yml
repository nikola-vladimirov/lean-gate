name: selftest

on:
  push:
  pull_request:

jobs:
  selftest:
    # macOS checks the BSD sed and date paths; Linux the GNU ones.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Syntax
        run: |
          bash -n bin/lean-gate
          for f in scripts/*.sh; do bash -n "$f"; done
      - name: Selftest
        run: bash bin/lean-gate selftest
